name: Deploy FloSpatial to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: npm install vite@5.4.11 rollup@4.24.0 @vitejs/plugin-react@4.3.4 @tailwindcss/vite@4.1.16 react@18.3.1 react-dom@18.3.1 typescript@5.6.3 @types/react@18.3.12 @types/react-dom@18.3.1 --legacy-peer-deps

      - name: Build
        run: npm exec --package=vite@5.4.11 --package=@vitejs/plugin-react@4.3.4 --package=@tailwindcss/vite@4.1.16 -- vite build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
